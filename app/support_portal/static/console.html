<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/static/theme.js"></script>
<title>Presenter Console</title>
<style>
  :root {
    --bg: #f5f6f9; --bg-elevated: #ffffff; --bg-elevated-2: #eef0f5;
    --border: #d8dce6; --text: #1b1f2b; --text-dim: #5b6478;
  }
  html[data-theme="dark"] {
    --bg: #0a0d14; --bg-elevated: #12161f; --bg-elevated-2: #171c28;
    --border: #232a3a; --text: #e7eaf2; --text-dim: #9299ad;
  }
  [hidden] { display: none !important; }
  body {
    font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px;
    background: var(--bg); color: var(--text);
  }
  fieldset { margin-bottom: 24px; border-radius: 8px; border-color: var(--border); }
  label { display: block; margin: 8px 0 4px; }
  select, input, button {
    font-size: 1rem; padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 8px;
    background: var(--bg-elevated-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
  }
  button { cursor: pointer; }
  #log { font-family: monospace; font-size: 0.85rem; background: var(--bg-elevated-2); padding: 8px; border-radius: 6px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
  .theme-toggle {
    width: auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--bg-elevated-2); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 12px; margin-bottom: 16px;
  }
  .theme-toggle .icon { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
</style>
</head>
<body>
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme">
    <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon icon-moon" viewBox="0 0 24 24" hidden><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    Theme
  </button>
  <h1>Presenter Console</h1>
  <label>Admin token</label>
  <input id="token" type="password" placeholder="admin token">

  <fieldset>
    <legend>Flip incident status</legend>
    <label>Service</label>
    <select id="service">
      <option>login</option><option>checkout</option><option>payments</option>
      <option>search</option><option>notifications</option><option>order-tracking</option>
    </select>
    <label>Status</label>
    <select id="status">
      <option value="operational">operational</option>
      <option value="degraded">degraded</option>
      <option value="outage">outage</option>
    </select>
    <label>Description</label>
    <input id="description" placeholder="short incident description">
    <button id="applyIncident">Apply</button>
  </fieldset>

  <fieldset>
    <legend>Fire ticket burst</legend>
    <label>Service (must have seeded burst phrasings)</label>
    <select id="burstService">
      <option value="checkout">checkout</option>
    </select>
    <label>Count</label>
    <input id="burstCount" type="number" value="15">
    <label>Interval (ms)</label>
    <input id="burstInterval" type="number" value="400">
    <button id="fireBurst">Fire burst</button>
  </fieldset>

  <div id="log"></div>

  <script>
    const tokenInput = document.getElementById('token');
    tokenInput.value = sessionStorage.getItem('admin_token') || '';
    tokenInput.addEventListener('input', () => sessionStorage.setItem('admin_token', tokenInput.value));

    function log(msg) {
      const el = document.getElementById('log');
      el.textContent = `${new Date().toLocaleTimeString()} ${msg}\n` + el.textContent;
    }

    async function post(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': tokenInput.value },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.statusText);
      return data;
    }

    document.getElementById('applyIncident').addEventListener('click', async () => {
      try {
        await post('/admin/status', {
          service: document.getElementById('service').value,
          status: document.getElementById('status').value,
          description: document.getElementById('description').value,
        });
        log('Incident status applied.');
      } catch (e) {
        log(`Error: ${e.message}`);
      }
    });

    async function pollBurstStatus(intervalMs, timeoutMs) {
      const deadline = Date.now() + timeoutMs;
      while (Date.now() < deadline) {
        await new Promise(r => setTimeout(r, intervalMs));
        const res = await fetch('/admin/burst-status', { headers: { 'X-Admin-Token': tokenInput.value } });
        const data = await res.json();
        if (!data.in_progress) return data;
      }
      return null;
    }

    document.getElementById('fireBurst').addEventListener('click', async () => {
      const btn = document.getElementById('fireBurst');
      btn.disabled = true;
      try {
        const data = await post('/admin/burst', {
          service: document.getElementById('burstService').value,
          count: parseInt(document.getElementById('burstCount').value, 10),
          interval_ms: parseInt(document.getElementById('burstInterval').value, 10),
        });
        log(`Burst started: ${JSON.stringify(data)}`);
        const finalStatus = await pollBurstStatus(500, 30000);
        if (finalStatus && finalStatus.last_error) {
          log(`Burst finished with an error: ${finalStatus.last_error}`);
        } else if (finalStatus) {
          log('Burst finished.');
        }
      } catch (e) {
        log(`Error: ${e.message}`);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
